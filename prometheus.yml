global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
  - job_name: 'embeddings'
    static_configs:
      - targets: ['embeddings:8000']
  - job_name: 'ingestion'
    static_configs:
      - targets: ['ingestion:8000']
  - job_name: 'llm'
    static_configs:
      - targets: ['llm:8000']