global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'embeddings'
    static_configs:
      - targets: ['embeddings:9090']
    metrics_path: '/metrics'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/metrics'

  - job_name: 'ingestion'
    static_configs:
      - targets: ['ingestion:50053']
    metrics_path: '/metrics'

  - job_name: 'llm'
    static_configs:
      - targets: ['llm:50054']
    metrics_path: '/metrics'