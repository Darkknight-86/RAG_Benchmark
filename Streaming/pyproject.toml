[project]
name = "websocket-streaming"
version = "0.1.0"
description = "Live streaming Yahoo stocks with websocket"
authors = [
    {name = "Andrew Young",email = "young.andre@northeastern.edu"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.8"
dependencies = [
    "yliveticker (>=0.3.0,<0.4.0)",
    "protobuf (>=3.20.0,<4)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src" }
]
