[tool.poetry]
name = "rag"
version = "0.1.0"
description = "RAG system for stock data"
authors = [
    "Darkknight-86 <bewick.j@northeastern.edu>"
]
readme = "README.md"
packages = [{include = "rag", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
boto3 = "^1.29.3"
clickhouse-connect = "^0.6.0"
python-dotenv = "^1.0.0"
sentence-transformers = "^2.2.2"
langchain = "0.1.0"
langchain-core = "0.1.8"
langchain-community = "0.0.10"
numpy = "1.24.3"
pandas = "2.0.3"
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.1"
langsmith = ">=0.0.63,<0.1.0"
yliveticker = "^0.3.0"
protobuf = "3.20.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.12.1"
isort = "^5.13.2"
mypy = "^1.8.0"
ruff = "^0.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I"]
ignore = []
