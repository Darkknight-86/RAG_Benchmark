[project]
name = "rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Darkknight-86",email = "bewick.j@northeastern.edu"}
]
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "boto3 (>=1.38.24,<2.0.0)",
    "langchain (>=0.3.25,<0.4.0)",
    "clickhouse-connect (>=0.8.17,<0.9.0)",
    "grpcio (>=1.62.0,<2.0.0)",
    "grpcio-tools (>=1.62.0,<2.0.0)",
    "protobuf (>=4.25.3,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "nltk (>=3.9.1,<4.0.0)",
    "torch (==2.2.2)",
    "transformers (<4.40.0)",
    "numpy (<2)",
    "opensearch-py (>=2.8.0,<3.0.0)",
    "docker (>=7.1.0,<8.0.0)",
    "cassandra-driver (>=3.29.2,<4.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)"
]

[tool.poetry]
packages = [{include = "rag", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
