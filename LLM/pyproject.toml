[tool.poetry]
name = "financial-rag-llm"
version = "0.1.0"
description = "Financial RAG LLM Service with enhanced processing and gRPC interface"
authors = [
    "Darkknight-86 <bewick.j@northeastern.edu>"
]
readme = "README.md"
packages = [{include = "*", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Core Dependencies - Actually Used
python-dotenv = "1.0.0"
grpcio = "1.60.0"
protobuf = "4.21.12"

# AI/ML Dependencies - MPS-compatible versions
transformers = "4.41.0"    # Avoids torch.isin MPS bug in 4.42+
torch = "2.3.0"             # PyTorch 2.3.0 with Apple MPS support
sentence-transformers = "2.2.2"
accelerate = "1.6.0"        # Latest Accelerate for proper MPS device mapping
huggingface-hub = "0.24.0"
safetensors = "0.4.3"       # Fast, safe model serialization (required by accelerate 1.6.0)

# LangChain Integration
langchain = "0.1.0"
langchain-core = "0.1.10"
langchain-community = "0.0.13"

# Data Processing
pandas = "2.2.3"
requests = "2.31.0"

# Optional Dependencies (uncomment if needed)
clickhouse-connect = "0.6.0"     # For ClickHouse integration
setuptools = "69.0.0"            # For pkg_resources (ClickHouse adapter)
# numpy = "1.26.4"                 # For numerical operations

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
black = "23.12.1"
ruff = "0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I"]
ignore = []
