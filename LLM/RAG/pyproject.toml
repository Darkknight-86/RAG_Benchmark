[project]
name = "rag"
version = "0.1.0"
description = "RAG System LLM Service"
authors = [
    {name = "Darkknight-86", email = "bewick.j@northeastern.edu"}
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.1",
    "langchain>=0.1.0",
    "langchain-community>=0.0.13",
    "langchain-core>=0.1.10",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "pydantic>=2.5.3",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.3",
    "pandas>=2.0.3",
    "tqdm>=4.66.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "arxiv>=2.0.0",
    "PyPDF2>=3.0.1",
    "python-magic>=0.4.27",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "huggingface-hub>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "langchain-community>=0.0.13",
    "sentencepiece>=0.2.0"
]

[tool.poetry]
name = "rag"
version = "0.1.0"
description = "RAG service for LLM"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "rag", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
protobuf = "^4.25.1"
transformers = "^4.37.2"
torch = "^2.2.0"
numpy = "^1.26.3"
sentence-transformers = "^2.2.2"
scikit-learn = "^1.4.0"
prometheus-client = "^0.19.0"
sentencepiece = "^0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
black = "^24.1.1"
isort = "^5.13.2"
mypy = "^1.8.0"
pylint = "^3.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
