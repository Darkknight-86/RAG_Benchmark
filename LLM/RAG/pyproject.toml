[project]
name = "rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Darkknight-86",email = "bewick.j@northeastern.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers (>=4.52.3,<5.0.0)",
    "faiss-cpu (>=1.11.0,<2.0.0)",
    "sentence-transformers (>=4.1.0,<5.0.0)",
    "accelerate (>=1.7.0,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "grpcio (>=1.62.0,<2.0.0)",
    "grpcio-tools (>=1.62.0,<2.0.0)",
    "protobuf (>=4.25.3,<5.0.0)"
]

[tool.poetry]
packages = [{include = "rag", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
