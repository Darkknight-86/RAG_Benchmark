version: '3.9'

services:
  api-gateway:
    build:
      context: .
      dockerfile: API_Gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"   # REST
      - "50051:50051" # gRPC
    depends_on:
      - embeddings
      - ingestion
      - llm
    networks: [rag-network]

  embeddings:
    build:
      context: .
      dockerfile: embeddings/Dockerfile
    container_name: embeddings
    ports:
      - "50052:50052"
    networks: [rag-network]

  ingestion:
    build:
      context: .
      dockerfile: Ingestion/grpc/Dockerfile
    container_name: ingestion
    ports:
      - "50053:50053"
    networks: [rag-network]

  llm:
    build:
      context: .
      dockerfile: LLM/RAG/Dockerfile
    container_name: llm
    ports:
      - "50054:50054"
    networks: [rag-network]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [rag-network]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [rag-network]

networks:
  rag-network:
    driver: bridge

volumes:
  metrics-data: