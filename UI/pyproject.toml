[project]
name = "ui"
version = "0.1.0"
description = "UI for RAG System"
authors = [
    {name = "Darkknight-86",email = "bewick.j@northeastern.edu"}
]
readme = "README.md"
requires-python = ">=3.8.1,<3.13"
dependencies = [
    "requests>=2.31.0",
    "flet>=0.21.0",
    "python-dotenv>=1.0.0"
]

[tool.poetry]
packages = [{include = "rag", from = "src"}]
name = "ui"
version = "0.1.0"
description = "UI for RAG System"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = ">=3.8.1,<3.13"
flet = "^0.21.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
