[tool.poetry]
name = "financial-rag-ui"
version = "0.1.0"
description = "Financial RAG System UI - Desktop and Web GUI for financial market queries"
authors = [
    "Darkknight-86 <bewick.j@northeastern.edu>"
]
readme = "README.md"
packages = [{include = "*", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Core Dependencies - Actually Used
python-dotenv = "1.0.0"
requests = "2.31.0"

# UI Framework
flet = "0.24.1"

# Optional Dependencies (uncomment if needed)
# httpx = "0.25.0"                 # For async HTTP requests
# pandas = "2.2.3"                 # For data processing
# streamlit = "1.28.0"             # For web dashboard
# plotly = "5.17.0"                # For interactive charts

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
black = "23.12.1"
ruff = "0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I"]
ignore = []
