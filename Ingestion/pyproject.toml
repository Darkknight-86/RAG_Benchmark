[project]
name = "rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Darkknight-86", email = "bewick.j@northeastern.edu"},
    {name = "trentwiles", email = "wilest7@gmail.com"},
    {name = "andrewd-young", email = "young.andre@northeastern.edu"}
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "opensearch-py (>=2.8.0,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "boto3 (>=1.38.26,<2.0.0)",
    "llama-parse (>=0.6.23,<0.7.0)",
    "fastapi (>=0.115.12,<0.116.0)",
    "grpcio (>=1.71.0,<2.0.0)",
    "grpcio-tools (>=1.71.0,<2.0.0)",
    "protobuf (>=6.31.1,<7.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[tool.poetry]
packages = [
    {include = "rag", from = "src"},
    {include = "grpc", from = "src"}
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
