[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway for RAG microservices with metrics collection"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
flask = "^3.0.0"
prometheus-client = "^0.19.0"
aiohttp = "^3.9.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
psutil = "^5.9.8"
pandas = "^2.2.0"
numpy = "^1.26.0"
grpcio = "^1.62.0"
grpcio-tools = "^1.62.0"
protobuf = "^4.25.3"

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
isort = "^5.13.2"
mypy = "^1.8.0"
flake8 = "^7.0.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/api_gateway --cov-report=term-missing"