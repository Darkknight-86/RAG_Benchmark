syntax = "proto3";

package ingestion;

// Service definition for the Ingestion Pipeline
service PipelineService {
  // Execute the ingestion pipeline
  rpc ExecutePipeline(PipelineRequest) returns (stream PipelineStatus) {}
}

message PipelineRequest {
  map<string, string> params = 1;
}

message PipelineStatus {
  string step = 1;
  string message = 2;
  bool is_complete = 3;
  bool is_error = 4;
  string error_message = 5;
}