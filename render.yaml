services:
  # Demo Mode - Lightweight Streamlit dashboard with sample data (free tier compatible)
  - type: web
    name: rag-benchmarking-platform
    env: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /
    envVars:
      # Render Configuration
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: true
      - key: ENVIRONMENT
        value: production

      # Streamlit Configuration (for dashboard)
      - key: STREAMLIT_SERVER_PORT
        value: 10000
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: none

      # ClickHouse Database Configuration (user-configurable via dashboard)
      # These can be left empty for demo mode or set in Render dashboard
      - key: CLICKHOUSE_HOST
        value: ""  # e.g., "your-instance.us-east-1.aws.clickhouse.cloud"
      - key: CLICKHOUSE_USER
        value: "default"
      - key: CLICKHOUSE_PASSWORD
        value: ""  # Set this in Render dashboard for security
      - key: CLICKHOUSE_DATABASE
        value: "default"
      - key: CLICKHOUSE_PORT
        value: 8443
      - key: CLICKHOUSE_SECURE
        value: true

      # HuggingFace Configuration
      - key: HUGGINGFACE_HUB_TOKEN
        value: ""  # Set this in Render dashboard for LLM features

      # LLM Service Configuration
      - key: DEFAULT_LLM_MODEL
        value: meta-llama/Llama-3.2-1B-Instruct
      - key: DEFAULT_TEMPERATURE
        value: 0.7
      - key: DEFAULT_MAX_TOKENS
        value: 1000
      - key: DEFAULT_TOP_K
        value: 5
      - key: SUPPORTED_MODELS
        value: meta-llama/Llama-3.2-1B-Instruct,meta-llama/Llama-3.2-3B-Instruct

      # Internal Service Ports (for inter-service communication)
      - key: EMBEDDINGS_GRPC_PORT
        value: 50051
      - key: LLM_GRPC_PORT
        value: 50054
      - key: API_GATEWAY_PORT
        value: 8000

      # Performance Optimization
      - key: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
      - key: TRANSFORMERS_CACHE
        value: /root/.cache/huggingface
      - key: HF_HOME
        value: /root/.cache/huggingface