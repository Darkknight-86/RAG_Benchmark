services:
  # Demo RAG Benchmarking Platform - Streamlit Dashboard Only
  - type: web
    name: rag-benchmark-demo
    env: docker
    dockerfilePath: ./Dockerfile.demo
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: true
      - key: STREAMLIT_SERVER_PORT
        value: 10000
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: none